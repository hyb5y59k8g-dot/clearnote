<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ClearNote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<header>
  <div class="top-row">
    <button id="newNote">➕ New Note</button>

    <div class="control-group">
      <label><strong>Language</strong></label>
      <select id="language">
        <option value="en-US">English</option>
        <option value="pl-PL">Polish</option>
      </select>
    </div>

    <div class="control-group">
      <label><strong>Speaker</strong></label>
      <select id="speaker">
        <option>Speaker 1</option>
        <option>Speaker 2</option>
        <option>Speaker 3</option>
      </select>
    </div>
  </div>

  <!-- Recorder Controls + Timer -->
  <div class="recorder">
    <button id="start" class="rec-btn play">▶︎</button>
    <button id="pause" class="rec-btn pause" disabled>⏸</button>
    <button id="stop" class="rec-btn stop" disabled>⏺</button>
    <div id="timer-container">
      <span id="recordDot"></span>
      <span id="timer">00:00</span>
    </div>
  </div>

  <div class="button-row">
    <button id="exportTXT">Export TXT</button>
    <button id="exportPDF">Export PDF</button>
  </div>
</header>

<main>
  <section class="editor">
    <h3>Transcript</h3>
    <div id="output"></div>

    <h3>Summary</h3>
    <div id="summary">Summary will appear here later.</div>
  </section>

  <section class="history">
    <details open>
      <summary><strong>Saved Notes</strong></summary>
      <ul id="history"></ul>
    </details>

    <details>
      <summary><strong>🗑️ Trash</strong></summary>
      <ul id="trash"></ul>
    </details>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
