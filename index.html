<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ClearNote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css?v=6" />
</head>

<body>

<header class="header">

  <!-- Top controls: New Note + Language -->
  <div class="top-row">
    <button id="newNote" class="primary">New Note</button>

    <div class="control">
      <label><strong>Language</strong></label>
      <select id="language">
        <option value="en-US" selected>English</option>
        <option value="pl-PL">Polish</option>
      </select>
    </div>
  </div>

  <!-- Recorder button + timer + blinking dot -->
  <div class="recorder">
    <button id="recordBtn" class="record-btn">● Record</button>
    <div class="status">
      <span id="timer">00:00</span>
      <span class="dot" id="recordDot"></span>
    </div>
  </div>

</header>

<main>

  <!-- Transcript section -->
  <section class="panel">
    <h3>Transcript</h3>
    <div id="output" class="box"></div>
  </section>

  <!-- Saved Notes collapsible -->
  <section class="panel">
    <h3 class="collapsible" onclick="toggleSection('notesList')">Saved Notes</h3>
    <ul id="notesList"></ul>
  </section>

  <!-- Trash collapsible -->
  <section class="panel">
    <h3 class="collapsible" onclick="toggleSection('trashList')">Trash</h3>
    <ul id="trashList"></ul>
  </section>

  <script src="app.js?v=6"></script>
</main>

</body>
</html>
