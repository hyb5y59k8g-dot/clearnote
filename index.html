<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ClearNote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<header>
  <div class="top-row">
    <button id="newNote">➕ New Note</button>

    <div class="control-group">
      <label><strong>Language</strong></label>
      <select id="language">
        <option value="en-US">English</option>
        <option value="pl-PL">Polish</option>
      </select>
    </div>

    <div class="control-group">
      <label><strong>Speaker</strong></label>
      <select id="speaker">
        <option>Speaker 1</option>
        <option>Speaker 2</option>
        <option>Speaker 3</option>
      </select>
    </div>
  </div>

  <!-- Recorder -->
  <div class="recorder">
    <button id="start" class="rec-btn">▶︎</button>
    <button id="pause" class="rec-btn" disabled>⏸</button>
    <button id="stop" class="rec-btn" disabled>⏺</button>

    <div id="timer-container">
      <span id="recordDot"></span>
      <span id="timer">00:00</span>
    </div>
  </div>
</header>

<main>

  <!-- Transcript Section -->
  <section class="card">
    <div class="card-header">
      <h3>Transcript</h3>
      <div class="card-actions">
        <button id="copyTranscript">📋 Copy</button>
        <button id="exportTranscriptTXT">⬇️ TXT</button>
        <button id="exportTranscriptPDF">📄 PDF</button>
      </div>
    </div>
    <div id="output" class="content-box"></div>
  </section>

  <!-- Summary Section -->
  <section class="card">
    <div class="card-header">
      <h3>Summary</h3>
      <div class="card-actions">
        <button id="copySummary">📋 Copy</button>
        <button id="exportSummaryTXT">⬇️ TXT</button>
        <button id="exportSummaryPDF">📄 PDF</button>
      </div>
    </div>
    <div id="summary" class="content-box"></div>
  </section>

  <!-- History -->
  <section class="card">
    <details open>
      <summary><strong>Saved Notes</strong></summary>
      <ul id="history"></ul>
    </details>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
