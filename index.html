<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClearNote</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>

  <!-- ROW 1 -->
  <div class="row row-1">
    <button id="newNote">New Note</button>
  </div>

  <!-- ROW 2 -->
  <div class="row row-2">
    <label>
      <strong>Language</strong>
      <select id="language">
        <option value="en-US">English</option>
        <option value="pl-PL">Polish</option>
      </select>
    </label>

    <label>
      <strong>Speaker</strong>
      <select id="speaker">
        <option>Speaker 1</option>
        <option>Speaker 2</option>
        <option>Speaker 3</option>
      </select>
    </label>
  </div>

  <!-- ROW 3 -->
  <div class="row row-3">
    <button id="start">Start</button>
    <button id="pause">Pause</button>
    <button id="resume">Resume</button>
    <button id="stop">Stop</button>
  </div>

  <!-- ROW 4 -->
  <div class="row row-4">
    <button id="exportPDF">Export PDF</button>
    <button id="exportTXT">Export TXT</button>
  </div>

</header>

<main>

  <section id="saved-meetings">
    <button id="toggleHistory">Saved Notes ▲</button>
    <ul id="history"></ul>
  </section>

  <section id="active-note">
    <h3>Transcript</h3>
    <div id="output"></div>

    <h3>Summary</h3>
    <div id="summary"></div>
  </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
